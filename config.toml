# Daily Dashboard configuration.
#
# Everything here used to be a constant in dashboard.py, which meant editing
# Python to change a ticker -- and `topic_of_week` is a *weekly* edit. Loaded
# by dashboard/config.py through tomllib and validated into Pydantic models,
# so a typo here is a startup error naming the field, not a KeyError at 07:00.
#
# Relative paths resolve against this file's directory.

[server]
# Every interface, so the phone log at /m is reachable over Tailscale. It was
# loopback-only by decision and the decision has not changed -- what changed is
# that there is now a second client, on a device that is not this one.
#
# Nothing here is what keeps the dashboard off eduroam. This binds; Windows
# Firewall decides. Inbound is default-deny on all three profiles with no allow
# rule for python, so the only interface that answers is the tailnet one --
# which is why the safe order is Tailscale first, and why an "Allow access"
# prompt for python must be refused. There is no auth on this server: anything
# that can reach the port can read the health log, the calendar and the day.
#
# The model's default in config.py stays 127.0.0.1, and should. A fresh
# checkout on someone else's machine has no tailnet and no reason to listen
# past its own loopback.
host = "0.0.0.0"
port = 8502
open_browser = true
log_level = "INFO"
log_file = "dashboard.log"

[paths]
db = "dashboard.db"
problems = "problems.json"  # hand-curated seed pool, read-only to the server
metrics = "metrics.jsonl"
static = "web"        # index.html, style.css, app/*.js, data/, vendor/katex
spelling = "spelling.json"  # the hand-curated word pool, read-only to the server
# What the day asks of you. Read-only to the server, hand-edited, and optional
# -- no file means no camp is on. See dashboard/trainplan.py.
training = "training.toml"
# The write-ups, one markdown file per topic. The one directory here that is a
# source rather than an export: they are opened in a real editor, and the server
# only ever creates one that is missing -- it never rewrites one that exists.
investigations = "investigations"
# Scratch buffers for the recall boxes -- what the embedded editor opens when
# you write a theorem out in nvim instead of in the textarea. Working files,
# not records: the graded answer is a database row, and these are gitignored.
scratch = "scratch"

[llm]
model = "claude-sonnet-5"
max_tokens = 16000
# How long a connection may go *silent* — a per-read limit, not a budget for
# the whole call, since it becomes the socket timeout. A math generation with
# four searches has run 847s wall and finished comfortably inside the 300.
timeout_seconds = 300
# The same, for calls with no tools. Nothing toolless in metrics.jsonl has ever
# taken over 12.2s, and sharing the search-sized budget above is what left a
# stalled word grading hanging for five minutes.
quick_timeout_seconds = 60
# Retried only when the failed attempt was never billed — see llm._with_retries.
max_retries = 2
retry_backoff_seconds = 1.0
max_pause_continuations = 6
web_search_max_uses = 4
web_search_cost_usd = 0.01

# Per-kind model overrides, keyed by the `kind` in metrics.jsonl. Grading a
# recalled theorem is a short comparison against a statement already on file —
# a much smaller job than writing a verified Putnam problem, and one that runs
# every day, so the difference compounds.
[llm.models]
theorem-grade = "claude-haiku-4-5"
# The same argument, for the same shape of job: grading a recalled argument
# pattern is a comparison against a statement already on file.
pattern-grade = "claude-haiku-4-5"
# Filing a write-up under a subject folder: a short list in, one name out. The
# smallest job in the app by a wide margin -- a few hundred tokens once a day,
# which is well under a cent a year.
investigate-file = "claude-haiku-4-5"
# Rating a problem you brought yourself: one statement in, a tier out. The only
# paid call the math problem still makes, and it fires when you paste something
# rather than when a page loads -- which is the property that made the old
# $0.15-0.80 generation worth deleting.
own-problem = "claude-haiku-4-5"

# Approx $/token for the retrieval-efficiency log. Sonnet 5 is at intro
# pricing through 2026-08-31; update when it reverts to $3/$15.
[llm.pricing.claude-sonnet-5]
input = 2e-6
output = 10e-6

[llm.pricing.claude-opus-4-8]
input = 5e-6
output = 25e-6

[llm.pricing.claude-haiku-4-5]
input = 1e-6
output = 5e-6

[math]
# Fallback when `rotation` below is empty. Kept so a fixed topic is still a
# one-line edit if you ever want to sit on one for a while.
topic_of_week = "generating functions"

# The Sunday on which rotation[0] begins. The index advances every Sunday
# (see config.week_index), so `rotation_start` must itself be a Sunday --
# validated at startup rather than left as a comment nobody checks.
rotation_start = 2026-07-26

# Weekly topic rotation, weighted by how much of the Putnam each area is:
# analysis 7 slots (~28%), algebra 6 (~24%), combinatorics 5 (~20%), number
# theory 4 (~16%), geometry 2 (~8%), probability 1 (~4%). Broad areas are
# split into topics narrow enough to actually study in a week -- "finite
# group theory", not "abstract algebra".
#
# Ordered to interleave the areas, so you never get seven consecutive weeks
# of analysis. 25 entries = a ~6-month cycle.
#
# A topic with no [topic_library] entry costs one LLM call the first time it
# comes up (textbook + six theorem links), then is cached in `topic_info`
# forever. Only "generating functions" is hand-curated today.
rotation = [
    "generating functions",
    "limits and recursive sequences",
    "polynomial roots, Vieta, and symmetric functions",
    "bijections, inclusion-exclusion, and double counting",
    "modular arithmetic and congruences",
    "analytic and vector geometry in the plane",
    "infinite series - convergence, telescoping, rearrangement",
    "determinants and matrix manipulation",
    "linear recurrences and difference equations",
    "divisibility, primes, and factorization",
    "discrete probability and expected value",
    "definite-integral technique",
    "polynomial identities, divisibility, and irreducibility",
    "pigeonhole and extremal arguments",
    "digits, base representations, and floor functions",
    "convexity, lattice points, and area arguments",
    "inequalities - AM-GM, Cauchy-Schwarz, Jensen, rearrangement",
    "eigenvalues, characteristic polynomials, and matrix powers",
    "combinatorial games and invariants",
    "multiplicative order, primitive roots, Fermat/Euler",
    "continuity, IVT, and the mean value theorems",
    "vector spaces, rank, and linear independence",
    "derivatives, Taylor expansion, and extrema",
    "finite group theory - orders, Lagrange, group actions",
    "functional equations",
]

# What each day of the week asks for.
#
# Every day used to ask for the same thing: a ladder centred on the rating,
# nearest rung served. That is a thermostat, and it converged exactly as a
# thermostat should -- every batch generated between 2026-08-20 and 2026-08-28
# offered the identical three tiers, and the middle one was served. Five days a
# week of AIME problems is not a difficulty problem, it is a variance problem,
# and no prompt fixes it because the selection rule is what removes the
# variance.
#
# So the week has a shape now. Two calibrated days, four days out of a proof
# textbook, one day of reading. The thermostat stays where it belongs -- on the
# two days whose job is to be calibrated.
#
#   compute         the ladder, nearest rung. A numeric answer.
#   proof           one proof problem, easier end. Needs ingenuity, not an evening.
#   proof-long      the two-day problem. Thursday has no hints; Friday has two.
#   proof-showcase  a famous proof, picked on elegance, rating ignored.
#   reading         no problem at all -- half-hour segments, unrated.
[math.week]
sunday    = "reading"
monday    = "compute"
tuesday   = "compute"
wednesday = "proof"
thursday  = "proof-long"
friday    = "proof-long"
saturday  = "proof-showcase"

# Fixed elo anchors per problem tier. The LLM picks a tier, never a number,
# so the math rating scale cannot drift.
# topic -> broad area, the bucket its results rate into. Validated against
# `rotation` at startup: a topic with no area would rate into nothing.
[math.areas]
"generating functions"                                        = "combinatorics"
"limits and recursive sequences"                              = "analysis"
"polynomial roots, Vieta, and symmetric functions"            = "algebra"
"bijections, inclusion-exclusion, and double counting"        = "combinatorics"
"modular arithmetic and congruences"                          = "number theory"
"analytic and vector geometry in the plane"                   = "geometry"
"infinite series - convergence, telescoping, rearrangement"   = "analysis"
"determinants and matrix manipulation"                        = "algebra"
"linear recurrences and difference equations"                 = "combinatorics"
"divisibility, primes, and factorization"                     = "number theory"
"discrete probability and expected value"                     = "probability"
"definite-integral technique"                                 = "analysis"
"polynomial identities, divisibility, and irreducibility"     = "algebra"
"pigeonhole and extremal arguments"                           = "combinatorics"
"digits, base representations, and floor functions"           = "number theory"
"convexity, lattice points, and area arguments"               = "geometry"
"inequalities - AM-GM, Cauchy-Schwarz, Jensen, rearrangement" = "analysis"
"eigenvalues, characteristic polynomials, and matrix powers"  = "algebra"
"combinatorial games and invariants"                          = "combinatorics"
"multiplicative order, primitive roots, Fermat/Euler"         = "number theory"
"continuity, IVT, and the mean value theorems"                = "analysis"
"vector spaces, rank, and linear independence"                = "algebra"
"derivatives, Taylor expansion, and extrema"                  = "analysis"
"finite group theory - orders, Lagrange, group actions"       = "algebra"
"functional equations"                                        = "analysis"

[math.anchors]
amc = 1100
"aime-early" = 1300
"aime-late" = 1500
"olympiad-easy" = 1650
"putnam-early" = 1750
"olympiad-hard" = 1900
"putnam-late" = 2050

# Reference time per tier, in minutes. Optional to submit; when you do give a
# time, it scales how far the result moves your rating.
#
# The pinned point is 1.5x, not 1x: taking 30 minutes on a 20-minute
# aime-late problem is worth exactly what an untimed solve is worth. Faster
# than that pays, up to 1.5x at about 0.76x the reference time; slower decays
# smoothly to a floor of 0.66x, reached at 3x. Only a result that *gains*
# rating is scaled -- see scoring.timed_elo.
#
# So these are not "how long it should take you". They are the scale the
# curve is measured against, and the honest way to set one is to put it where
# you would call a solve unremarkable. Edit freely: unlike the elo constants
# in scoring.py this reinterprets nothing, because the K actually applied is
# frozen onto every rating_event as it is written.
[math.par_minutes]
amc = 10
"aime-early" = 15
"aime-late" = 20
"olympiad-easy" = 30
"putnam-early" = 40
"olympiad-hard" = 45
"putnam-late" = 60

# ---------------------------------------------------------------------------
# The proof days. Wednesday through Saturday, all from one book.
#
# The book is on disk and the generator reads it. It is never asked to recall
# a problem from it -- see dashboard/proofbook.py for the failure that
# prevents, and `proofbook.json` for the index that makes it possible.
[math.proof]
enabled = true
pdf = "textbooks/Putnam_and_beyond.pdf"

# What each proof day is allowed to reach for, as tiers from [math.anchors].
#
# Wednesday tops out below where Thursday starts, which is the whole
# distinction between them: Wednesday is a problem you should finish in a
# sitting and Thursday is one you should not. Saturday shares Thursday's band
# because a famous problem is usually a hard one, and its rung is chosen on
# fame rather than on the rating anyway.
[math.proof.tiers]
proof = ["olympiad-easy", "putnam-early"]
"proof-long" = ["putnam-early", "olympiad-hard", "putnam-late"]
"proof-showcase" = ["putnam-early", "olympiad-hard", "putnam-late"]

# rotation topic -> the section of the book its proof problems come from.
#
# Hand-checked against the contents page, one at a time, and that is the point:
# the automatic matcher in `proofbook` sent "polynomial roots, Vieta, and
# symmetric functions" to *3.4 Equations with Functions as Unknowns*, which is
# a real section about something else entirely. Nine of twenty-five went wrong
# that way, and none of them looked wrong.
#
# All twenty-five are pinned, and the twenty-fifth is why. "digits, base
# representations, and floor functions" is served by *5.1.3 The Greatest
# Integer Function*, and the matcher sent it to *3.2.1 Functions* -- a section
# in the analysis chapter, matched on the word "functions". A topic left out of
# this table still works (matcher, then the area's chapter); it just may not
# work on the topic you meant.
[math.proof.sections]
"generating functions"                                        = "6.4.2"  # Generating Functions
"limits and recursive sequences"                              = "3.1.3"  # Limits of Sequences
"polynomial roots, Vieta, and symmetric functions"            = "2.2.4"  # Viete's Relations
"bijections, inclusion-exclusion, and double counting"        = "6.4.4"  # Inclusion-Exclusion
"modular arithmetic and congruences"                          = "5.2.3"  # Modular Arithmetic
"analytic and vector geometry in the plane"                   = "4.1.2"  # Coordinate Geometry
"infinite series - convergence, telescoping, rearrangement"   = "3.1.6"  # Telescopic Series
"determinants and matrix manipulation"                        = "2.3.2"  # Determinants
"linear recurrences and difference equations"                 = "3.1.2"  # Linear Recursive Sequences
"divisibility, primes, and factorization"                     = "5.2.1"  # Factorization and Divisibility
"discrete probability and expected value"                     = "6.5.1"  # Equally Likely Cases
"definite-integral technique"                                 = "3.2.9"  # Definite Integrals
"polynomial identities, divisibility, and irreducibility"     = "2.2.7"  # Irreducible Polynomials
"pigeonhole and extremal arguments"                           = "1.3"    # The Pigeonhole Principle
"convexity, lattice points, and area arguments"               = "3.2.7"  # Convex Functions
"inequalities - AM-GM, Cauchy-Schwarz, Jensen, rearrangement" = "2.1.5"  # AM-GM
"eigenvalues, characteristic polynomials, and matrix powers"  = "2.3.6"  # Eigenvalues, Eigenvectors
"combinatorial games and invariants"                          = "1.5"    # Invariants and Semi-Invariants
"multiplicative order, primitive roots, Fermat/Euler"         = "5.2.4"  # Fermat's Little Theorem
"continuity, IVT, and the mean value theorems"                = "3.2.6"  # The Mean Value Theorem
"vector spaces, rank, and linear independence"                = "2.3.5"  # Vector Spaces
"derivatives, Taylor expansion, and extrema"                  = "3.2.12" # Taylor and Fourier Series
"finite group theory - orders, Lagrange, group actions"       = "2.4.2"  # Groups
"functional equations"                                        = "3.4.1"  # Functional Equations
"digits, base representations, and floor functions"           = "5.1.3"  # The Greatest Integer Function

# ---------------------------------------------------------------------------
# Sunday. Read, and do many easy problems.
#
# Three half-hour segments generated, one or two expected. The over-generation
# is deliberate: how much of a week's topic is already familiar varies hugely
# by topic, so the plan offers more than the day asks for and you take what is
# new. Which segments you skipped -- and why -- go into the next generation, or
# every month opens with the same introduction.
[math.reading]
enabled = true
segments = 3
segment_minutes = 30

# One theorem a day, sampled from the deck you curate. The weight of a card is
# (days since it last appeared - cooldown_days) ** recency_exponent, and zero
# through the cooldown -- so yesterday's theorem cannot be today's.
# ---------------------------------------------------------------------------
# The spelling bee. Five words a day, spoken rather than shown.
#
# Costs nothing: the words come from the hand-curated pool in spelling.json,
# never from a generation. Rated on its own elo track, one result per word
# against that word's tier anchor — so getting the hard one right is worth
# more than the easy one, which is the whole reason the ladder ramps.
[spelling]
words_per_day = 5

# The ladder, easiest first. One entry per word, each naming a tier below.
# Two `medium` slots because that is where most commonly-misspelled words
# actually live; the ends are the stretch in each direction.
ladder = ["easy", "medium", "medium", "difficult", "impossible"]

# How long after missing a word before it can come back. Missed words are
# *preferred* once eligible — the point of this is to stop misspelling the
# words you misspell, so the ones you got wrong are the ones worth repeating.
relearn_days = 7

# How long before a word you got *right* may come round again. Long, because
# repeats should be rare: with ~180 words in the pool and five a day, the pool
# itself takes about five weeks to cycle, and this stops a thin tier from
# repeating sooner than that.
cooldown_days = 30

# How many of the five may be a word you have already been asked. The relearn
# rule above is uncapped by nature -- every word that has come due wants its
# rung back -- and a morning of five words you had already seen is that rule
# working as written and reading as a bee with nothing left to ask. One a day,
# spent on the word you have missed most. Best effort: once the pool has
# cycled there is no such thing as a word you have not had, and every rung
# repeats whatever this says.
max_repeats = 1

# Fixed elo anchors per tier, exactly as [math.anchors] works: difficulty is a
# tier name in spelling.json, never a number, so the scale cannot drift when
# the pool is edited.
[spelling.anchors]
easy = 1150
medium = 1350
difficult = 1550
impossible = 1750

# ---------------------------------------------------------------------------
# The trick of the day. One identity, shortcut or technique from the week's
# topic, taught by a set of problems you work rather than a card you read.
#
# Costs nothing per day if you let it. Three ways in, cheapest first: the
# overnight file (`./batch.sh --trick-context` at 3am, unattended); the prompt
# the panel hands you to paste into the Claude app, which runs on the
# subscription rather than the API — the same split that makes the investigation
# free; and, last and only if you press it, a live generation at ~$0.02-0.04.
# The optional challenge is graded by a much smaller call, and only if you
# actually attempt it.
#
# Coupled to [math].rotation on purpose: the trick is drawn from whatever this
# week's topic is. Weeks whose topic has no computational shortcut in it get a
# *technique* instead — the standard opening move, the canonical construction —
# rather than a shortcut invented to fill the slot. Which one the day got is
# recorded on the card.
[tricks]
# The graded set: four one-line applications, then four that need the trick
# recognised rather than handed to you. On every day after the first, one of
# the medium problems is a callback to an *older* trick instead — replacing a
# medium rather than adding to the set, so the day is always the same size.
# The optional challenge is always exactly one, and is not counted here.
easy = 4
medium = 4

# Fixed elo anchors per band, exactly as [math.anchors] and [spelling.anchors]
# work. A different scale from the math problem's: an `easy` trick problem is a
# one-line application of an identity, which is a much smaller claim than an
# AMC problem. Results rate on the math track in the `tricks` bucket, which is
# deliberately not one of [math.areas] — so this moves a number of its own and
# leaves the headline math rating to the problems.
[tricks.anchors]
easy = 1200
medium = 1450
challenge = 1750

[theorems]
cooldown_days = 1
recency_exponent = 2.0

[markets]
tickers = ["^SPX", "AAPL", "MSFT", "NVDA"]
cache_seconds = 600

# Append the symbols from positions.csv to the movements list above.
#
# Worth understanding before leaving this on, because it is the one setting
# here that gives something away: with it true, the tickers you hold are on
# screen whether or not the portfolio is unlocked. The Hello prompt is then
# protecting share counts, cost basis and dollar values -- not the fact that
# you own them. Set false and the lock covers the whole thing, at the cost of
# not seeing your positions move until you unlock.
include_holdings = true

# ---------------------------------------------------------------------------
# The portfolio panel: your actual holdings, behind Windows Hello.
#
# Reads `[paths].positions` -- a Fidelity positions export, gitignored and
# never committed. Absent by default; the panel says so rather than erroring.
#
# What the lock is and is not, stated here because the name oversells it:
# WebAuthn asks Windows for *user verification*, and Windows decides whether a
# fingerprint, a face or the PIN satisfies that. There is no way for a web page
# to insist on the finger. So this stops someone glancing at an open laptop; it
# does not stop someone who knows the PIN, and it does nothing at all about the
# CSV sitting unencrypted on disk where any process running as you can read it.
[portfolio]
enabled = true

# How long an unlock lasts. Enforced by the server -- the token stops being
# accepted whether or not a browser is still counting down -- so closing the
# laptop mid-window does not leave the endpoint open.
unlock_seconds = 300

# WebAuthn relying-party ID. Left unset it is derived from [server].host, which
# maps 127.0.0.1 to "localhost" -- the only value that works, since an rp_id
# must be a domain and an IP address is not one. Set it only if you serve this
# under a real hostname.
# rp_id = "dashboard.example"

[garmin]
# The Forerunner 165 sync. Off until the watch is on the wrist and the token
# store exists -- flip this to true after running, from the repo root:
#
#     wsl -e bash -lc "cd '<repo>' && . ./venv.sh && \$PY -m dashboard.garmin login"
#
# That command is the only thing that ever sees the password. It reads
# GARMIN_EMAIL and GARMIN_PASSWORD from .env, prompts for the MFA code, and
# writes OAuth tokens to token_dir; the server logs in from those and never
# holds a credential. Once the tokens exist the password can come back out of
# .env if you would rather it did not sit there.
enabled = true

# Sync in the background whenever the dashboard is opened. There is no 3am
# task for this and deliberately so: the machine is asleep at 3am, and the
# first boot of the morning is a trigger that is actually present.
auto = true

# How far back each run re-pulls. Garmin keeps revising a night's sleep score
# for hours after you get up, so a one-day window would freeze the first draft
# of every night. Re-pulling is free -- the write is an upsert that refuses to
# overwrite anything you corrected by hand.
days = 3

# Floor between automatic runs. These numbers change once a night; opening the
# dashboard six times before lunch should not be six trips to Garmin.
min_interval_minutes = 60

token_dir = "~/.garminconnect"

[calendar]
# argv, not a shell string -- see feeds.gcalcli. `wsl -e` is prepended
# automatically when the server runs on Windows.
command = ["gcalcli", "--nocolor"]
cache_seconds = 300
timeout_seconds = 60
# Not a performance budget: this is how long before a calendar you just made
# can be typed into, and how long a deleted one stays on offer. `list` is 0.27s.
list_cache_seconds = 300
# The classifier's training window, and how often it is re-read from gcalcli.
history_days = 1095
history_days_ahead = 180
history_cache_seconds = 86400
# An add is synchronous with someone's Enter key; a read is not.
write_timeout_seconds = 20
# Where an event goes when nothing else decides. Must be a writable calendar.
default_calendar = "Special Events"
# 0 = Monday. Google's own week view starts on Sunday (6), and so does this.
week_starts_on = 6

[todo]
# The prior for anything with a due date. Not [calendar].default_calendar --
# that one is the classifier's shrug, this one is "work is homework".
default_calendar = "Homework"
# Writing to one of these makes a tracked item that can be finished; writing
# anywhere else is an ordinary event. This is the whole of the todo/event
# distinction, and it is the picker that already sits beside the box.
todo_calendars = ["Homework", "Tests"]
# How far an unbounded "every tuesday" runs. A semester is about fifteen weeks.
recur_weeks = 12

# Aliases. Whole-word substitutions, like variables: `os` expands in "new os
# homework" and not in "buy banjos". Keys must be one word and must not be a
# word the date parser reads -- `sat`, `may` and friends are refused at load.
# `calendar` is optional and overrides the default above.
[todo.subjects]
fpm = { name = "US National Security Policy Making" }
db = { name = "Database Concepts" }
os = { name = "Operating Systems" }
alg = { name = "Abstract Algebra" }
oop = { name = "Object Oriented SWE" }

[news]
cache_seconds = 900
proxy_prefix = "https://login.proxy.library.nd.edu/login?url="
paywalled = [
    "wsj.com",
    "ft.com",
    "nytimes.com",
    "economist.com",
    "bloomberg.com",
    "washingtonpost.com",
]
# How many headlines to take from each category, in order.
quotas = [
    { cat = "uspolitics", n = 2 },
    { cat = "world", n = 1 },
    { cat = "finance", n = 1 },
    { cat = "other", n = 1 },
]
feeds = [
    { cat = "uspolitics", url = "https://rss.politico.com/politics-news.xml" },
    { cat = "uspolitics", url = "https://feeds.npr.org/1014/rss.xml" },
    { cat = "world", url = "https://feeds.bbci.co.uk/news/world/rss.xml" },
    { cat = "finance", url = "https://www.cnbc.com/id/100003114/device/rss/rss.html" },
    { cat = "finance", url = "https://www.ft.com/rss/home" },
    { cat = "other", url = "https://feeds.arstechnica.com/arstechnica/index" },
]

# ---------------------------------------------------------------------------
# The investigation of the day.
#
# The politics class hands out things to look into. They go in a pool, one is
# drawn a day, it is written up in a real editor, and the result is graded in
# the Claude app and pasted back.
#
# Nothing here costs an API call except the one-line filing call below: the
# prompt is assembled from a rubric and your own text, and the ballot is JSON
# you paste back. Use a *dedicated Claude Project* for the grading -- project
# memory is isolated from your global chat memory and from other projects, so a
# semester of foreign-policy write-ups does not leak into everything else you
# ask Claude.
# ---------------------------------------------------------------------------
# The embedded editor.
#
# Two panels fork one: the investigation write-up below, and the two theorem
# recall boxes on the math tab. Both get a real terminal editor on a real pty
# -- this is not an emulation, so your own config, your plugins and your
# muscle memory all arrive with it.
[editor]
# Editors to try, in order; the first one on PATH wins.
editor = ["nvim", "vim"]

# Ex commands run with -c, and therefore *after* your own config.
#
# The default exists because of the browser, not because of taste. Chrome
# reserves Ctrl-R and will not give it to a page, so vim's redo cannot be
# reached inside the panel however this is wired; `U` is the nearest free key.
# Ctrl-W is reserved the same way and window commands are simply unavailable
# in a browser tab -- which is why both files are real files you can also open
# from a terminal, where none of this applies.
#
# Empty the list for vim exactly as you configured it.
commands = ["nnoremap U <C-r>"]

# Lines of terminal scrollback. Only ever reached by `:!` output; a buffer
# scrolls inside the editor, not into the terminal's history.
scrollback = 1000

[investigate]
# The opponent rating every investigation is scored against. One number, not a
# table: the topics differ in subject, not in difficulty, so there is nothing
# for a second anchor to mean. Fixed, so the scale cannot drift when the
# grading model changes.
anchor = 1500

# The subject folders write-ups are filed under, and the list the classifier
# chooses from. Broad on purpose and not limited to foreign policy -- the class
# is one source of topics, not the only one.
#
# A seeded list rather than an empty directory, because the cold start is
# exactly when a classifier invents near-duplicates. It may still add folders
# beyond these; this is a floor, not a whitelist. Renaming one here does not
# move anything already filed.
folders = [
    "national security and defense",
    "foreign policy and diplomacy",
    "trade and the global economy",
    "immigration",
    "health policy",
    "climate and energy",
    "civil rights and liberties",
    "gender and family policy",
    "race and inequality",
    "elections and democracy",
    "courts and the constitution",
    "technology, speech and privacy",
    "education",
    "crime and policing",
    "taxes and the budget",
    "labor and welfare",
]

# Once a folder holds this many write-ups, new ones are filed into a sub-folder
# of it -- so "national security and defense" grows a `ukraine/`, a `middle
# east/` and so on rather than becoming a directory of sixty files.
#
# Only ever affects the file being placed now. Nothing already written is
# moved: a bulk re-file of your own prose, decided by a model, is not something
# this should do unasked.
split_at = 25

# ---------------------------------------------------------------------------
# The starter argument deck.
#
# The same recall machinery as the theorem deck, pointed at argument patterns
# instead: one card a day, drawn by how long since it last came up, answered
# in two boxes before anything is revealed, graded, worth +/-3.
#
# Hand-written rather than generated, for the reason `[topic_library]` is: a
# card that costs nothing and is wrong only in ways you can see beats one
# regenerated at a fraction of a cent a time. These are seeded into the deck at
# startup if a card of the same name is not already there, so editing a
# statement here does *not* rewrite a card you have already been graded on --
# archive it in the panel and it will come back with the new text.
#
# You will not learn a pattern from a card. You learn it by being hit with one
# and not seeing it coming, which is why the ballot is asked to name the
# patterns that showed up and the panel offers to add them.

[[investigate.patterns]]
name = "Principal-agent problem"
topic = "incentives"
statement = "Whenever one party acts on another's behalf, their interests diverge and the principal cannot fully observe the agent. Most 'why doesn't the agency just do X' arguments die here: the agency's incentives are not the public's."

[[investigate.patterns]]
name = "Tragedy of the commons"
topic = "incentives"
statement = "A shared resource with private benefit and socialised cost gets over-consumed, even when every user knows it. The argument is about which of the three fixes applies — property rights, regulation, or community norms — not whether the problem is real."

[[investigate.patterns]]
name = "Base-rate neglect"
topic = "statistics"
statement = "Judging how likely something is from how vivid or representative the evidence is, ignoring how common it is to begin with. The tell is a striking anecdote standing in for a rate."

[[investigate.patterns]]
name = "Concentrated benefits, diffuse costs"
topic = "incentives"
statement = "A policy costing everyone a little and paying a few a lot will be defended far harder than it is opposed, regardless of whether it is good. Explains persistence, not merit — using it to argue a policy is *wrong* is the mistake."

[[investigate.patterns]]
name = "Baptists and bootleggers"
topic = "incentives"
statement = "A restriction backed at once by those who think it moral and those who profit from it. The coalition tells you nothing about whether the restriction is right, and everything about why it is hard to remove."

[[investigate.patterns]]
name = "Seen and unseen (opportunity cost)"
topic = "economics"
statement = "The visible effect of a policy is not its net effect: what the same money, time or attention would otherwise have done is invisible and usually uncounted. Every 'this created N jobs' claim owes an account of the unseen."

[[investigate.patterns]]
name = "Chesterton's fence"
topic = "reasoning"
statement = "Do not remove a rule until you can state why it was put there. A burden-of-proof move, not a conservative one — it is discharged by giving the reason, and it fails when the reason is known and bad."

[[investigate.patterns]]
name = "Motte and bailey"
topic = "rhetoric"
statement = "Arguing a strong, useful claim (the bailey) and retreating under fire to a weak, obvious one (the motte) as though they were the same claim. Caught by asking which version is being defended right now."

[[investigate.patterns]]
name = "Isolated demand for rigor"
topic = "rhetoric"
statement = "Applying a standard of evidence to an opponent's claim that you do not apply to your own. Not a fallacy in the claim attacked — the attack may be correct — but a reason to check the symmetry."

[[investigate.patterns]]
name = "Negative externality"
topic = "economics"
statement = "A cost of a transaction borne by someone outside it, so the price is wrong and too much of the thing gets produced. The argument is over the size of the cost and who should internalise it, rarely over whether it exists."

[[investigate.patterns]]
name = "Regulatory capture"
topic = "institutions"
statement = "A regulator comes to serve the industry it regulates, because that industry supplies its information, its staff and its political cover. Predicts that a rule will be written to raise rivals' costs rather than to protect anyone."

[[investigate.patterns]]
name = "Second-best, and the nirvana fallacy"
topic = "reasoning"
statement = "Comparing a real policy against a perfect alternative that is not on the table. The comparison that matters is against the other thing that could actually happen, including doing nothing."

[[investigate.patterns]]
name = "Selection effect"
topic = "statistics"
statement = "The sample was not drawn at random from the population the claim is about — people selected into it, or out of it, for reasons related to the outcome. Ask how someone got into the data before asking what the data says."

[[investigate.patterns]]
name = "Revealed versus stated preference"
topic = "reasoning"
statement = "What people say they want and what they choose under real constraints diverge. Powerful against survey evidence and easy to over-apply: a constrained choice reveals the constraint as much as the preference."

[[investigate.patterns]]
name = "Rights as trumps"
topic = "ethics"
statement = "A rights claim refuses the trade-off rather than losing it — it says the aggregate calculation does not get to run. Recognising it is what stops a utilitarian and a deontologist arguing past each other for an hour."

[[investigate.patterns]]
name = "Slippery slope, valid and invalid"
topic = "reasoning"
statement = "Valid when a mechanism carries you down the slope — a precedent, an incentive, an institution. Invalid when the slope is asserted. Always ask for the step, not the destination."

[arxiv]
cache_seconds = 3600
max_results = 20
query = """
(cat:cs.AI OR cat:cs.LG OR cat:cs.CL) AND (abs:"language model" OR abs:JEPA OR \
abs:"joint embedding" OR abs:"game playing" OR abs:poker OR \
abs:"imperfect information" OR abs:"branching factor" OR \
abs:"reinforcement learning" AND abs:game)\
"""

# Hand-curated theorem lists + free textbook links, so the LLM never has to
# regenerate them. Unknown topics get generated once and cached in SQLite.
[topic_library."generating functions"]
textbook = { title = "generatingfunctionology (Wilf) — free full PDF", url = "https://www2.math.upenn.edu/~wilf/gfologyLinked2.pdf" }
theorems = [
    { title = "Stars and Bars", url = "https://en.wikipedia.org/wiki/Stars_and_bars_(combinatorics)" },
    { title = "Generalized Binomial Theorem", url = "https://en.wikipedia.org/wiki/Binomial_series" },
    { title = "Generating Functions (overview + linear recurrences)", url = "https://en.wikipedia.org/wiki/Generating_function" },
    { title = "Partial Fraction Decomposition", url = "https://en.wikipedia.org/wiki/Partial_fraction_decomposition" },
    { title = "Catalan Numbers via GFs", url = "https://en.wikipedia.org/wiki/Catalan_number" },
    { title = "Exponential Generating Functions", url = "https://en.wikipedia.org/wiki/Generating_function#Exponential_generating_function_(EGF)" },
]
