[arxiv]
cache_seconds = 3600
max_results = 20
query = """
(cat:cs.AI OR cat:cs.LG OR cat:cs.CL) AND (abs:"language model" OR abs:JEPA OR \
abs:"joint embedding" OR abs:"game playing" OR abs:poker OR \
abs:"imperfect information" OR abs:"branching factor" OR \
abs:"reinforcement learning" AND abs:game)\
"""

