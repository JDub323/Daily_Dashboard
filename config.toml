# Daily Dashboard configuration.
#
# Everything here used to be a constant in dashboard.py, which meant editing
# Python to change a ticker -- and `topic_of_week` is a *weekly* edit. Loaded
# by dashboard/config.py through tomllib and validated into Pydantic models,
# so a typo here is a startup error naming the field, not a KeyError at 07:00.
#
# Relative paths resolve against this file's directory.

[server]
host = "127.0.0.1"          # localhost-only by decision; see REWRITE_PLAN.md
port = 8502
open_browser = true
log_level = "INFO"
log_file = "dashboard.log"

[paths]
db = "dashboard.db"
problems = "problems.json"  # hand-curated seed pool, read-only to the server
metrics = "metrics.jsonl"
static = "web"        # index.html, style.css, app/*.js, data/, vendor/katex

[llm]
model = "claude-sonnet-5"
max_tokens = 16000
timeout_seconds = 300
max_pause_continuations = 6
web_search_max_uses = 4
web_search_cost_usd = 0.01

# Approx $/token for the retrieval-efficiency log. Sonnet 5 is at intro
# pricing through 2026-08-31; update when it reverts to $3/$15.
[llm.pricing.claude-sonnet-5]
input = 2e-6
output = 10e-6

[llm.pricing.claude-opus-4-8]
input = 5e-6
output = 25e-6

[llm.pricing.claude-haiku-4-5]
input = 1e-6
output = 5e-6

[math]
# Fallback when `rotation` below is empty. Kept so a fixed topic is still a
# one-line edit if you ever want to sit on one for a while.
topic_of_week = "generating functions"

# The Sunday on which rotation[0] begins. The index advances every Sunday
# (see config.week_index), so `rotation_start` must itself be a Sunday --
# validated at startup rather than left as a comment nobody checks.
rotation_start = 2026-07-26

# Weekly topic rotation, weighted by how much of the Putnam each area is:
# analysis 7 slots (~28%), algebra 6 (~24%), combinatorics 5 (~20%), number
# theory 4 (~16%), geometry 2 (~8%), probability 1 (~4%). Broad areas are
# split into topics narrow enough to actually study in a week -- "finite
# group theory", not "abstract algebra".
#
# Ordered to interleave the areas, so you never get seven consecutive weeks
# of analysis. 25 entries = a ~6-month cycle.
#
# A topic with no [topic_library] entry costs one LLM call the first time it
# comes up (textbook + six theorem links), then is cached in `topic_info`
# forever. Only "generating functions" is hand-curated today.
rotation = [
    "generating functions",
    "limits and recursive sequences",
    "polynomial roots, Vieta, and symmetric functions",
    "bijections, inclusion-exclusion, and double counting",
    "modular arithmetic and congruences",
    "analytic and vector geometry in the plane",
    "infinite series - convergence, telescoping, rearrangement",
    "determinants and matrix manipulation",
    "linear recurrences and difference equations",
    "divisibility, primes, and factorization",
    "discrete probability and expected value",
    "definite-integral technique",
    "polynomial identities, divisibility, and irreducibility",
    "pigeonhole and extremal arguments",
    "digits, base representations, and floor functions",
    "convexity, lattice points, and area arguments",
    "inequalities - AM-GM, Cauchy-Schwarz, Jensen, rearrangement",
    "eigenvalues, characteristic polynomials, and matrix powers",
    "combinatorial games and invariants",
    "multiplicative order, primitive roots, Fermat/Euler",
    "continuity, IVT, and the mean value theorems",
    "vector spaces, rank, and linear independence",
    "derivatives, Taylor expansion, and extrema",
    "finite group theory - orders, Lagrange, group actions",
    "functional equations",
]

# Fixed elo anchors per problem tier. The LLM picks a tier, never a number,
# so the math rating scale cannot drift.
# topic -> broad area, the bucket its results rate into. Validated against
# `rotation` at startup: a topic with no area would rate into nothing.
[math.areas]
"generating functions"                                        = "combinatorics"
"limits and recursive sequences"                              = "analysis"
"polynomial roots, Vieta, and symmetric functions"            = "algebra"
"bijections, inclusion-exclusion, and double counting"        = "combinatorics"
"modular arithmetic and congruences"                          = "number theory"
"analytic and vector geometry in the plane"                   = "geometry"
"infinite series - convergence, telescoping, rearrangement"   = "analysis"
"determinants and matrix manipulation"                        = "algebra"
"linear recurrences and difference equations"                 = "combinatorics"
"divisibility, primes, and factorization"                     = "number theory"
"discrete probability and expected value"                     = "probability"
"definite-integral technique"                                 = "analysis"
"polynomial identities, divisibility, and irreducibility"     = "algebra"
"pigeonhole and extremal arguments"                           = "combinatorics"
"digits, base representations, and floor functions"           = "number theory"
"convexity, lattice points, and area arguments"               = "geometry"
"inequalities - AM-GM, Cauchy-Schwarz, Jensen, rearrangement" = "analysis"
"eigenvalues, characteristic polynomials, and matrix powers"  = "algebra"
"combinatorial games and invariants"                          = "combinatorics"
"multiplicative order, primitive roots, Fermat/Euler"         = "number theory"
"continuity, IVT, and the mean value theorems"                = "analysis"
"vector spaces, rank, and linear independence"                = "algebra"
"derivatives, Taylor expansion, and extrema"                  = "analysis"
"finite group theory - orders, Lagrange, group actions"       = "algebra"
"functional equations"                                        = "analysis"

[math.anchors]
amc = 1100
"aime-early" = 1300
"aime-late" = 1500
"olympiad-easy" = 1650
"putnam-early" = 1750
"olympiad-hard" = 1900
"putnam-late" = 2050

# Reference time per tier, in minutes. Optional to submit; when you do give a
# time, it scales how far the result moves your rating.
#
# The pinned point is 1.5x, not 1x: taking 30 minutes on a 20-minute
# aime-late problem is worth exactly what an untimed solve is worth. Faster
# than that pays, up to 1.5x at about 0.76x the reference time; slower decays
# smoothly to a floor of 0.66x, reached at 3x. Only a result that *gains*
# rating is scaled -- see scoring.timed_elo.
#
# So these are not "how long it should take you". They are the scale the
# curve is measured against, and the honest way to set one is to put it where
# you would call a solve unremarkable. Edit freely: unlike the elo constants
# in scoring.py this reinterprets nothing, because the K actually applied is
# frozen onto every rating_event as it is written.
[math.par_minutes]
amc = 10
"aime-early" = 15
"aime-late" = 20
"olympiad-easy" = 30
"putnam-early" = 40
"olympiad-hard" = 45
"putnam-late" = 60

# One theorem a day, sampled from the deck you curate. The weight of a card is
# (days since it last appeared - cooldown_days) ** recency_exponent, and zero
# through the cooldown -- so yesterday's theorem cannot be today's.
[theorems]
cooldown_days = 1
recency_exponent = 2.0

[markets]
tickers = ["^SPX", "AAPL", "MSFT", "NVDA"]
cache_seconds = 600

[calendar]
# argv, not a shell string -- see feeds.gcalcli. `wsl -e` is prepended
# automatically when the server runs on Windows.
command = ["gcalcli", "--nocolor"]
cache_seconds = 300
timeout_seconds = 60

[news]
cache_seconds = 900
proxy_prefix = "https://login.proxy.library.nd.edu/login?url="
paywalled = [
    "wsj.com",
    "ft.com",
    "nytimes.com",
    "economist.com",
    "bloomberg.com",
    "washingtonpost.com",
]
# How many headlines to take from each category, in order.
quotas = [
    { cat = "uspolitics", n = 2 },
    { cat = "world", n = 1 },
    { cat = "finance", n = 1 },
    { cat = "other", n = 1 },
]
feeds = [
    { cat = "uspolitics", url = "https://rss.politico.com/politics-news.xml" },
    { cat = "uspolitics", url = "https://feeds.npr.org/1014/rss.xml" },
    { cat = "world", url = "https://feeds.bbci.co.uk/news/world/rss.xml" },
    { cat = "finance", url = "https://www.cnbc.com/id/100003114/device/rss/rss.html" },
    { cat = "finance", url = "https://www.ft.com/rss/home" },
    { cat = "other", url = "https://feeds.arstechnica.com/arstechnica/index" },
]

[arxiv]
cache_seconds = 3600
max_results = 20
query = """
(cat:cs.AI OR cat:cs.LG OR cat:cs.CL) AND (abs:"language model" OR abs:JEPA OR \
abs:"joint embedding" OR abs:"game playing" OR abs:poker OR \
abs:"imperfect information" OR abs:"branching factor" OR \
abs:"reinforcement learning" AND abs:game)\
"""

# Hand-curated theorem lists + free textbook links, so the LLM never has to
# regenerate them. Unknown topics get generated once and cached in SQLite.
[topic_library."generating functions"]
textbook = { title = "generatingfunctionology (Wilf) — free full PDF", url = "https://www2.math.upenn.edu/~wilf/gfologyLinked2.pdf" }
theorems = [
    { title = "Stars and Bars", url = "https://en.wikipedia.org/wiki/Stars_and_bars_(combinatorics)" },
    { title = "Generalized Binomial Theorem", url = "https://en.wikipedia.org/wiki/Binomial_series" },
    { title = "Generating Functions (overview + linear recurrences)", url = "https://en.wikipedia.org/wiki/Generating_function" },
    { title = "Partial Fraction Decomposition", url = "https://en.wikipedia.org/wiki/Partial_fraction_decomposition" },
    { title = "Catalan Numbers via GFs", url = "https://en.wikipedia.org/wiki/Catalan_number" },
    { title = "Exponential Generating Functions", url = "https://en.wikipedia.org/wiki/Generating_function#Exponential_generating_function_(EGF)" },
]
