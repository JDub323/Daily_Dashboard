[project]
name = "sharpness"
# Read from dashboard/__init__.py so the version is written down once.
dynamic = ["version"]
description = "A single-user personal dashboard served at localhost:8502."
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "John Whalen" }]

# The whole dependency set. The stdlib-purity constraint was dropped
# deliberately; this is the "small, boring" replacement for it.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
    # Signature verification for the portfolio panel's Windows Hello lock.
    # The alternative was hand-rolling ECDSA P-256 and PKCS#1 v1.5 over a
    # hand-rolled CBOR decoder, which is a lot of arithmetic to get subtly
    # wrong inside the one part of this project that is load-bearing for
    # something. `dashboard/webauthn.py` imports it lazily, so a venv that
    # predates this still boots -- the panel says what to run instead.
    "cryptography>=42",
    # Picks which calendar a quick-added event belongs on, from the ~380
    # distinct event titles already sitting in the account's own calendars --
    # the labels are free, because an event's calendar *is* the label.
    # `dashboard/calclass.py` imports it lazily, like cryptography above: a
    # venv that predates this still boots, and the classifier falls back to its
    # keyword rules with the reason shown in the panel.
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
# The Forerunner sync. Optional, and lazily imported in `dashboard/garmin.py`
# like cryptography and scikit-learn above, for a sharper reason than either of
# them: this is an unofficial client against a private API that has already
# broken this integration's predecessor once (`garth`, killed by Garmin's March
# 2026 auth change). A hard dependency on it would mean the day it breaks
# again is a day the dashboard does not start.
garmin = ["garminconnect>=0.2.25"]

[project.scripts]
sharpness = "dashboard.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "dashboard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["dashboard"]

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
    "error",
    # Starlette's TestClient still imports httpx 0.x; not ours to fix.
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web/vendor"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff's own
]
ignore = [
    # `raise ... from err` inside a handler that already logs the traceback
    # adds noise without adding information.
    "B904",
    # RUF001 flags characters that could be a confusable lookalike for ASCII.
    # The word of the day carries IPA, so `ˈ` (MODIFIER LETTER VERTICAL LINE,
    # the primary-stress mark) appears in prompts, docstrings and test data as
    # itself rather than as a mistyped apostrophe. The rule cannot tell the
    # difference, and the alternative is a `noqa` on every line of IPA the
    # project will ever contain.
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose — _round_half_up, _clean_blocks
# and the feed cache are exactly the things worth pinning down.
"tests/*" = ["SLF001"]

[tool.ruff.format]
quote-style = "double"
