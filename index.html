<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>daily dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script type="module">import { Chess } from "/chess.js"; window.Chess = Chess;</script>
<link rel="stylesheet" href="/style.css">
</head><body>
<header>
  <h1>daily dashboard</h1>
  <span class="sub" id="hdr-date"></span>
  <span class="sub" id="hdr-topic"></span>
  <span class="sub" id="hdr-completion"></span>
</header>

<div id="tasks"></div>

<main id="layout">
  <div class="col" id="col-left"></div>
  <div class="col" id="col-center"></div>
  <div class="col" id="col-right"></div>
</main>

<div id="modal-overlay" hidden>
  <div id="modal">
    <div id="modal-head"><span id="modal-title"></span><button id="modal-close">✕</button></div>
    <div id="modal-body"></div>
  </div>
</div>
<div id="toast" hidden></div>

<script src="/app.js"></script>
</body></html>
