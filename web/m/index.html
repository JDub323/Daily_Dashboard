<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- `viewport-fit=cover` plus the `safe-area-inset` padding in the
       stylesheet: without both, the bottom tab bar sits under the home
       indicator on any iPhone since the X and the row you tap most is the row
       you cannot tap. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Stops iOS zooming the page when a number field takes focus, which it
       does by default on inputs under 16px and never zooms back out from. -->
  <meta name="format-detection" content="telephone=no">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0c12">
  <!-- Standalone once it is on the home screen: no address bar, no browser
       chrome, which is the whole difference between a bookmark and something
       that behaves like an app. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="log">
  <title>log</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-day">
      <span id="day">—</span>
      <!-- The hour every entry is filed against, and the only control on this
           screen that is not a log. It is here rather than inside each log
           because it is the same answer for all five and because the case it
           exists for — noticing at three that lunch never got entered — is one
           you are in before you have chosen which log to open. -->
      <button id="hour" class="hour" aria-label="the hour being logged against">—</button>
    </div>
    <div id="net" class="net" aria-live="polite"></div>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs" aria-label="which log"></nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
