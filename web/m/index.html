<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- `viewport-fit=cover` plus the `safe-area-inset` padding in the
       stylesheet: without both, the bottom tab bar sits under the home
       indicator on any iPhone since the X and the row you tap most is the row
       you cannot tap. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0c12">
  <!-- Standalone once it is on the home screen: no address bar, no browser
       chrome, which is the whole difference between a bookmark and something
       that behaves like an app. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="sharpness">
  <title>sharpness — log</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body class="booting">

<!-- The title screen, and it is the dashboard's own rather than one that looks
     like it: same markup, same `app/splash.js`, same `splash.css`. The ids are
     load-bearing — `paintSplash` writes into all three by id, and `initSplash`
     builds the starfield into the two `.sp-stars` layers. -->
<div id="splash" tabindex="-1" role="dialog" aria-label="sharpness — press enter to begin">
  <div class="sp-art" aria-hidden="true">
    <div class="sp-glow"></div>
    <div class="sp-stars"></div>
    <div class="sp-stars2"></div>
    <div class="sp-horizon"></div>
  </div>
  <div class="sp-frame">
    <div></div>
    <div class="sp-logo">
      <h1>Sharpness</h1>
      <div class="sp-rule"></div>
      <div class="sp-sub" id="sp-sub">FIGHT CAMP</div>
    </div>
    <div class="sp-press">PRESS ENTER</div>
  </div>
  <div class="sp-bar" aria-hidden="true">
    <span id="sp-file">FILE 01</span>
    <span id="sp-fight"></span>
  </div>
  <div class="sp-grain" aria-hidden="true"></div>
</div>

<div id="shell">
  <!-- The top bar is the dashboard's, shortened. `h1` carries the plated
       wordmark through the same `#topbar h1` rule the desktop uses. -->
  <header id="topbar">
    <h1>sharpness</h1>
    <!-- A button: the check-in leaves the bar once it is done, and this is
         the way back to it. `drawHeader` fills it. -->
    <button class="sub" id="day" aria-label="today — opens the check-in">—</button>
  </header>

  <!-- The hour every entry is filed against, and the only control here that is
       not a log. It sits above the tabs rather than inside one because it is
       the same answer for all five, and because the case it exists for —
       noticing at three that lunch never got entered — is one you are in
       before you have chosen which log to open. -->
  <div id="hourbar">
    <button id="hour" class="hour" aria-label="the hour being logged against">—</button>
    <!-- The send button. Nothing in this app reaches the laptop except by a tap
         on this, which is why it is a `button` and not the status line it used
         to be: the queue is the record, sending is an errand you run when you
         are somewhere the laptop can hear you. -->
    <button id="net" class="net" aria-live="polite" disabled>nothing to send</button>
  </div>

  <main id="view" class="panel"></main>

  <nav class="tabs" id="tabs" aria-label="which log"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
