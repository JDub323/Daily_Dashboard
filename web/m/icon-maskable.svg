  <rect x="48" y="58" width="96" height="11" rx="5.5" fill="#e8b458"/>
  <rect x="48" y="91" width="96" height="11" rx="5.5" fill="#dfe6f2"/>
  <rect x="48" y="124" width="56" height="11" rx="5.5" fill="#5ccfe6"/>
</svg>
