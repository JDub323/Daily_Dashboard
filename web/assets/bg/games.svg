<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<!-- Games: wordle rows left, a pokedoku 3x3 and dice right. -->
<g fill="none" stroke="#cdd6e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <!-- wordle board, left. The solved row is the filled one. -->
  <g transform="translate(80 150)">
    <g>
      <rect x="0"   y="0" width="64" height="64" rx="6"/>
      <rect x="76"  y="0" width="64" height="64" rx="6"/>
      <rect x="152" y="0" width="64" height="64" rx="6"/>
      <rect x="228" y="0" width="64" height="64" rx="6"/>
      <rect x="304" y="0" width="64" height="64" rx="6"/>
    </g>
    <g transform="translate(0 76)">
      <rect x="0"   y="0" width="64" height="64" rx="6"/>
      <rect x="76"  y="0" width="64" height="64" rx="6" fill="#cdd6e4"/>
      <rect x="152" y="0" width="64" height="64" rx="6"/>
      <rect x="228" y="0" width="64" height="64" rx="6"/>
      <rect x="304" y="0" width="64" height="64" rx="6"/>
    </g>
    <g transform="translate(0 152)">
      <rect x="0"   y="0" width="64" height="64" rx="6" fill="#cdd6e4"/>
      <rect x="76"  y="0" width="64" height="64" rx="6"/>
      <rect x="152" y="0" width="64" height="64" rx="6" fill="#cdd6e4"/>
      <rect x="228" y="0" width="64" height="64" rx="6"/>
      <rect x="304" y="0" width="64" height="64" rx="6"/>
    </g>
    <g transform="translate(0 228)">
      <rect x="0"   y="0" width="64" height="64" rx="6" fill="#cdd6e4"/>
      <rect x="76"  y="0" width="64" height="64" rx="6" fill="#cdd6e4"/>
      <rect x="152" y="0" width="64" height="64" rx="6" fill="#cdd6e4"/>
      <rect x="228" y="0" width="64" height="64" rx="6" fill="#cdd6e4"/>
      <rect x="304" y="0" width="64" height="64" rx="6" fill="#cdd6e4"/>
    </g>
  </g>

  <!-- pokedoku, right: a 3x3 with its row and column headers -->
  <g transform="translate(1180 170)">
    <g opacity=".55">
      <circle cx="130" cy="-40" r="26"/><circle cx="230" cy="-40" r="26"/><circle cx="330" cy="-40" r="26"/>
      <circle cx="30" cy="60" r="26"/><circle cx="30" cy="160" r="26"/><circle cx="30" cy="260" r="26"/>
    </g>
    <rect x="82"  y="12"  width="96" height="96" rx="8"/>
    <rect x="182" y="12"  width="96" height="96" rx="8" fill="#cdd6e4"/>
    <rect x="282" y="12"  width="96" height="96" rx="8"/>
    <rect x="82"  y="112" width="96" height="96" rx="8" fill="#cdd6e4"/>
    <rect x="182" y="112" width="96" height="96" rx="8"/>
    <rect x="282" y="112" width="96" height="96" rx="8" fill="#cdd6e4"/>
    <rect x="82"  y="212" width="96" height="96" rx="8"/>
    <rect x="182" y="212" width="96" height="96" rx="8" fill="#cdd6e4"/>
    <rect x="282" y="212" width="96" height="96" rx="8"/>
  </g>

  <!-- dice, lower right -->
  <g transform="translate(1240 620)">
    <rect x="0" y="0" width="130" height="130" rx="18"/>
    <circle cx="34"  cy="34"  r="9" fill="#cdd6e4"/>
    <circle cx="96"  cy="34"  r="9" fill="#cdd6e4"/>
    <circle cx="65"  cy="65"  r="9" fill="#cdd6e4"/>
    <circle cx="34"  cy="96"  r="9" fill="#cdd6e4"/>
    <circle cx="96"  cy="96"  r="9" fill="#cdd6e4"/>
  </g>
  <g transform="translate(1410 700)" opacity=".6">
    <rect x="0" y="0" width="100" height="100" rx="14"/>
    <circle cx="30" cy="30" r="7" fill="#cdd6e4"/>
    <circle cx="70" cy="70" r="7" fill="#cdd6e4"/>
  </g>

  <!-- a keyboard row, faint, lower left -->
  <g opacity=".4" transform="translate(80 690)">
    <rect x="0"   y="0" width="46" height="46" rx="6"/>
    <rect x="56"  y="0" width="46" height="46" rx="6"/>
    <rect x="112" y="0" width="46" height="46" rx="6"/>
    <rect x="168" y="0" width="46" height="46" rx="6"/>
    <rect x="28"  y="56" width="46" height="46" rx="6"/>
    <rect x="84"  y="56" width="46" height="46" rx="6"/>
    <rect x="140" y="56" width="46" height="46" rx="6"/>
  </g>
</g>
</svg>
