<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<!-- Math: outlined glyphs and drawn geometry. The glyphs are stroked rather
     than filled so they read as line art next to the curves and the lattice. -->
<g fill="none" stroke="#cdd6e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <text x="90" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="340"
        fill="none" stroke="#cdd6e4" stroke-width="2.5">&#8747;</text>
  <text x="230" y="820" font-family="Georgia, 'Times New Roman', serif" font-size="200"
        fill="none" stroke="#cdd6e4" stroke-width="2">&#931;</text>
  <text x="1400" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="180"
        fill="none" stroke="#cdd6e4" stroke-width="2">&#960;</text>
  <text x="1180" y="840" font-family="Georgia, 'Times New Roman', serif" font-size="150"
        fill="none" stroke="#cdd6e4" stroke-width="2">&#8734;</text>

  <!-- a parabola with its axes, upper right -->
  <path d="M1140 180 h340 M1310 120 v300" opacity=".45"/>
  <path d="M1160 150 Q1310 500 1460 150" stroke-width="2.5"/>

  <!-- a lattice, low left -->
  <g opacity=".55">
    <circle cx="120" cy="600" r="4"/><circle cx="180" cy="600" r="4"/><circle cx="240" cy="600" r="4"/>
    <circle cx="120" cy="660" r="4"/><circle cx="180" cy="660" r="4"/><circle cx="240" cy="660" r="4"/>
    <circle cx="120" cy="720" r="4"/><circle cx="180" cy="720" r="4"/><circle cx="240" cy="720" r="4"/>
    <path d="M120 720 L240 660 L180 600 Z"/>
  </g>

  <!-- circle with an inscribed angle, right -->
  <circle cx="1330" cy="560" r="120"/>
  <path d="M1330 560 L1450 560 M1330 560 L1245 645"/>
  <path d="M1370 560 a40 40 0 0 1 -12 28" opacity=".6"/>

  <!-- a right triangle, far right edge -->
  <path d="M1500 760 h110 v-110 z" opacity=".5"/>
  <path d="M1500 740 h20 v20" opacity=".5"/>

  <!-- golden-ratio spiral arcs, faint, mid-left -->
  <g opacity=".4">
    <path d="M420 300 a80 80 0 0 0 -80 -80"/>
    <path d="M340 220 a130 130 0 0 0 -130 130"/>
  </g>
</g>
</svg>
