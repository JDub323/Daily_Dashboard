<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<!-- Markets: candlesticks left, a trend line with axes right. -->
<g fill="none" stroke="#cdd6e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <!-- candlesticks, left, sitting on a baseline -->
  <g transform="translate(70 200)">
    <path d="M0 500 h420" opacity=".5"/>
    <!-- each: wick, then body -->
    <path d="M30 150 v300"/>   <rect x="14"  y="220" width="32" height="150"/>
    <path d="M90 200 v290"/>   <rect x="74"  y="300" width="32" height="120" fill="#cdd6e4"/>
    <path d="M150 120 v320"/>  <rect x="134" y="190" width="32" height="180"/>
    <path d="M210 90  v300"/>  <rect x="194" y="140" width="32" height="200" fill="#cdd6e4"/>
    <path d="M270 60  v290"/>  <rect x="254" y="110" width="32" height="170"/>
    <path d="M330 130 v320"/>  <rect x="314" y="200" width="32" height="190" fill="#cdd6e4"/>
    <path d="M390 40  v300"/>  <rect x="374" y="90"  width="32" height="180"/>
  </g>

  <!-- axes and a line, right -->
  <g transform="translate(1120 180)">
    <path d="M40 0 v480 h420" opacity=".55"/>
    <!-- tick marks -->
    <g opacity=".4">
      <path d="M34 100 h12 M34 200 h12 M34 300 h12 M34 400 h12"/>
      <path d="M140 474 v12 M240 474 v12 M340 474 v12 M440 474 v12"/>
    </g>
    <path d="M40 400 L120 340 L200 380 L280 250 L360 290 L440 120" stroke-width="3"/>
    <!-- the last point, and the arrow off the top -->
    <circle cx="440" cy="120" r="8"/>
    <path d="M400 70 h60 v60" opacity=".6"/>
  </g>

  <!-- percent and dollar glyphs, outlined, far edges -->
  <text x="1400" y="800" font-family="Georgia, 'Times New Roman', serif" font-size="190"
        fill="none" stroke="#cdd6e4" stroke-width="2" opacity=".55">%</text>
  <text x="120" y="820" font-family="Georgia, 'Times New Roman', serif" font-size="170"
        fill="none" stroke="#cdd6e4" stroke-width="2" opacity=".55">$</text>

  <!-- a sparkline, faint, top left -->
  <path d="M90 120 l40 -26 l40 34 l40 -50 l40 22 l40 -40" opacity=".4"/>
</g>
</svg>
