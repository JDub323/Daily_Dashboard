<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<!-- Hobbies: a piano keyboard left, a knight over board squares right. -->
<g fill="none" stroke="#cdd6e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <!-- keyboard, left. Whites as one run of rects, blacks filled on top. -->
  <g transform="translate(60 300)">
    <g>
      <rect x="0"   y="0" width="48" height="240"/>
      <rect x="48"  y="0" width="48" height="240"/>
      <rect x="96"  y="0" width="48" height="240"/>
      <rect x="144" y="0" width="48" height="240"/>
      <rect x="192" y="0" width="48" height="240"/>
      <rect x="240" y="0" width="48" height="240"/>
      <rect x="288" y="0" width="48" height="240"/>
      <rect x="336" y="0" width="48" height="240"/>
    </g>
    <g fill="#cdd6e4">
      <rect x="33"  y="0" width="30" height="150"/>
      <rect x="81"  y="0" width="30" height="150"/>
      <rect x="177" y="0" width="30" height="150"/>
      <rect x="225" y="0" width="30" height="150"/>
      <rect x="273" y="0" width="30" height="150"/>
      <rect x="369" y="0" width="30" height="150"/>
    </g>
    <path d="M0 -18 h384" opacity=".5"/>
  </g>

  <!-- treble clef, outlined, upper left -->
  <text x="130" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="230"
        fill="none" stroke="#cdd6e4" stroke-width="2" opacity=".6">&#119070;</text>
  <!-- a stave behind it -->
  <g opacity=".35">
    <path d="M60 110 h420 M60 140 h420 M60 170 h420 M60 200 h420 M60 230 h420"/>
  </g>

  <!-- board squares, right, in perspective-free plan -->
  <g transform="translate(1180 520)" opacity=".7">
    <rect x="0"   y="0"   width="70" height="70" fill="#cdd6e4"/>
    <rect x="70"  y="0"   width="70" height="70"/>
    <rect x="140" y="0"   width="70" height="70" fill="#cdd6e4"/>
    <rect x="210" y="0"   width="70" height="70"/>
    <rect x="0"   y="70"  width="70" height="70"/>
    <rect x="70"  y="70"  width="70" height="70" fill="#cdd6e4"/>
    <rect x="140" y="70"  width="70" height="70"/>
    <rect x="210" y="70"  width="70" height="70" fill="#cdd6e4"/>
    <rect x="0"   y="140" width="70" height="70" fill="#cdd6e4"/>
    <rect x="70"  y="140" width="70" height="70"/>
    <rect x="140" y="140" width="70" height="70" fill="#cdd6e4"/>
    <rect x="210" y="140" width="70" height="70"/>
  </g>

  <!-- the knight, above the board -->
  <g transform="translate(1250 180)">
    <path d="M40 300 h180 v-26 h-180 z"/>
    <path d="M56 274 c0 -70 30 -96 62 -120 c-10 -18 -6 -34 6 -46
             c14 -14 34 -12 44 2 c26 -12 62 6 74 40 c14 40 6 96 -14 124
             c-14 20 -22 0 -22 0 z"/>
    <circle cx="150" cy="112" r="6" fill="#cdd6e4"/>
    <path d="M118 154 l-30 24" opacity=".7"/>
    <path d="M110 108 l14 -10" opacity=".7"/>
  </g>

  <!-- a few eighth notes drifting, low left -->
  <g opacity=".45" transform="translate(430 700)">
    <circle cx="0" cy="60" r="15"/><path d="M15 60 v-60"/>
    <circle cx="70" cy="80" r="15"/><path d="M85 80 v-60"/>
    <path d="M15 0 h70 v20"/>
  </g>
</g>
</svg>
