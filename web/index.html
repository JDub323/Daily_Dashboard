<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>daily dashboard</title>
<!-- KaTeX is vendored: see web/vendor/katex/PROVENANCE.txt. It used to load
     from a CDN with no SRI and no fallback, which made the whole app
     offline-broken. There is now no external runtime dependency at all. -->
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<script defer src="/vendor/katex/katex.min.js"></script>
<script defer src="/vendor/katex/auto-render.min.js"></script>
<link rel="stylesheet" href="/style.css">
</head><body>

<!-- The per-tab backdrop. A sibling of the content rather than a body
     background, because it has to be swappable and fadeable without the
     content inheriting the transition. Inert: it is decoration and must never
     be reachable by the focus ring or a screen reader. -->
<div id="bg" aria-hidden="true"></div>

<div id="shell">
  <header id="topbar">
    <h1>daily dashboard</h1>
    <span class="sub" id="hdr-date"></span>
    <span class="sub" id="hdr-topic"></span>
  </header>

  <nav id="tabbar" role="tablist" aria-label="sections"></nav>

  <!-- One pane per tab, built by tabs.js. Panels mount into their pane's
       .hero or .grid rather than into a global column. -->
  <main id="panes"></main>
</div>

<!-- nvchad's statusline: where you are, what is left, and the way to the
     cheatsheet. Fixed to the bottom so it survives scrolling the pane. -->
<footer id="statusline">
  <span id="st-tab">home</span>
  <span id="st-mode" class="st-seg">panels</span>
  <span id="st-completion" class="st-seg"></span>
  <span class="st-spacer"></span>
  <span class="st-seg st-hint"><kbd>?</kbd> keys</span>
</footer>

<div id="modal-overlay" hidden>
  <div id="modal">
    <div id="modal-head"><span id="modal-title"></span><button id="modal-close">✕</button></div>
    <div id="modal-body"></div>
  </div>
</div>
<div id="toast" hidden></div>

<script type="module" src="/app/main.js"></script>
</body></html>
