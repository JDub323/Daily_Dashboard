<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>sharpness</title>
<!-- KaTeX is vendored: see web/vendor/katex/PROVENANCE.txt. It used to load
     from a CDN with no SRI and no fallback, which made the whole app
     offline-broken. There is now no external runtime dependency at all. -->
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<script defer src="/vendor/katex/katex.min.js"></script>
<script defer src="/vendor/katex/auto-render.min.js"></script>
<!-- xterm.js, for the editor in the investigation panel. Vendored on the same
     terms as KaTeX, and loaded the same way — UMD onto the global, deferred,
     with the panel checking it arrived rather than assuming. See
     web/vendor/xterm/PROVENANCE.txt. -->
<link rel="stylesheet" href="/vendor/xterm/xterm.css">
<script defer src="/vendor/xterm/xterm.js"></script>
<script defer src="/vendor/xterm/addon-fit.js"></script>
<link rel="stylesheet" href="/style.css">
</head><body class="booting">

<!-- The title screen.
     Markup rather than JS-built, and `body.booting` hides the shell behind it,
     because a title screen that appears a beat *after* the dashboard has
     already painted is not a title screen — it is a thing that interrupts you.
     This way the first frame the browser paints is already the right one.
     splash.js only fills in the two data lines and owns the way out. -->
<div id="splash" tabindex="-1" role="dialog" aria-label="sharpness — press enter to begin">
  <div class="sp-art" aria-hidden="true">
    <div class="sp-glow"></div>
    <div class="sp-stars"></div>
    <div class="sp-stars2"></div>
    <div class="sp-horizon"></div>
  </div>
  <div class="sp-frame">
    <div></div>
    <div class="sp-logo">
      <h1>Sharpness</h1>
      <div class="sp-rule"></div>
      <div class="sp-sub" id="sp-sub">FIGHT CAMP</div>
    </div>
    <div class="sp-press">PRESS ENTER</div>
  </div>
  <div class="sp-bar" aria-hidden="true">
    <span id="sp-file">FILE 01</span>
    <span id="sp-fight"></span>
  </div>
  <div class="sp-vig" aria-hidden="true"></div>
  <div class="sp-grain" aria-hidden="true"></div>
  <div class="sp-scan" aria-hidden="true"></div>
</div>

<!-- The per-tab backdrop. A sibling of the content rather than a body
     background, because it has to be swappable and fadeable without the
     content inheriting the transition. Inert: it is decoration and must never
     be reachable by the focus ring or a screen reader. -->
<div id="bg" aria-hidden="true"></div>

<div id="shell">
  <header id="topbar">
    <h1>sharpness</h1>
    <span class="sub" id="hdr-date"></span>
    <span class="sub" id="hdr-phase"></span>
    <span class="sub" id="hdr-topic"></span>
  </header>

  <nav id="tabbar" role="tablist" aria-label="sections"></nav>

  <!-- One pane per tab, built by tabs.js. Panels mount into their pane's
       .hero or .grid rather than into a global column. -->
  <main id="panes"></main>
</div>

<!-- nvchad's statusline: where you are, what is left, and the way to the
     cheatsheet. Fixed to the bottom so it survives scrolling the pane. -->
<footer id="statusline">
  <span id="st-tab">home</span>
  <span id="st-mode" class="st-seg">panels</span>
  <span id="st-completion" class="st-seg"></span>
  <span class="st-spacer"></span>
  <span class="st-seg st-hint"><kbd>?</kbd> keys</span>
</footer>

<div id="modal-overlay" hidden>
  <div id="modal">
    <div id="modal-head"><span id="modal-title"></span><button id="modal-close">✕</button></div>
    <div id="modal-body"></div>
  </div>
</div>
<div id="toast" hidden></div>

<script type="module" src="/app/main.js"></script>
</body></html>
