<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>daily dashboard</title>
<!-- KaTeX is vendored: see web/vendor/katex/PROVENANCE.txt. It used to load
     from a CDN with no SRI and no fallback, which made the whole app
     offline-broken. There is now no external runtime dependency at all. -->
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<script defer src="/vendor/katex/katex.min.js"></script>
<script defer src="/vendor/katex/auto-render.min.js"></script>
<link rel="stylesheet" href="/style.css">
</head><body>
<header>
  <h1>daily dashboard</h1>
  <span class="sub" id="hdr-date"></span>
  <span class="sub" id="hdr-topic"></span>
  <span class="sub" id="hdr-completion"></span>
</header>

<div id="tasks"></div>

<main id="layout">
  <div class="col" id="col-left"></div>
  <div class="col" id="col-center"></div>
  <div class="col" id="col-right"></div>
</main>

<div id="modal-overlay" hidden>
  <div id="modal">
    <div id="modal-head"><span id="modal-title"></span><button id="modal-close">✕</button></div>
    <div id="modal-body"></div>
  </div>
</div>
<div id="toast" hidden></div>

<script type="module" src="/app/main.js"></script>
</body></html>
